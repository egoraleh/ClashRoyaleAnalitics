spring.application.name=clashroyaleback
server.servlet.context-path=/api
clashroyale.api.base-url=https://api.clashroyale.com/v1
clashroyale.api.token=${CLASH_ROYALE_API_TOKEN:}
ai.analytics.base-url=${AI_ANALYTICS_BASE_URL:}
ai.analytics.generate-deck-path=${AI_ANALYTICS_GENERATE_DECK_PATH:/generate-deck}
ai.analytics.compare-path=${AI_ANALYTICS_COMPARE_PATH:/compare}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clashroyale}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:clash}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:clash}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
